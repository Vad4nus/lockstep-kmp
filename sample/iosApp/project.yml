name: Sample
options:
  bundleIdPrefix: io.github.vad4nus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
targets:
  Sample:
    type: application
    platform: iOS
    sources:
      - Sources
    preBuildScripts:
      - name: Build SampleShared
        script: cd "$SRCROOT/../.." && ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vad4nus.sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: [-ObjC, -framework, SampleShared]
  SampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Sample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vad4nus.sample.tests
        GENERATE_INFOPLIST_FILE: YES
  SampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Sample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vad4nus.sample.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sample:
    build:
      targets:
        Sample: all
        SampleTests: [test]
        SampleUITests: [test]
    test:
      targets:
        - SampleTests
        - SampleUITests
